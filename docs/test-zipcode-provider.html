<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Test ZipcodeBatchesProvider</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .test h3 { margin-top: 0; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>ZipcodeBatchesProvider Test Suite</h1>
    <div id="results"></div>

    <script src="./ZipcodeBatchesProvider.js"></script>
    <script>
        const results = document.getElementById('results');

        function addTest(name, status, message, data) {
            const div = document.createElement('div');
            div.className = `test ${status}`;
            div.innerHTML = `
                <h3>${status === 'success' ? '✓' : '✗'} ${name}</h3>
                <p>${message}</p>
                ${data ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
            `;
            results.appendChild(div);
        }

        async function runTests() {
            console.log('Starting tests...');

            // Test 1: Get batches by zipcode
            try {
                const batches = await ZipcodeBatchesProvider.getBatchesByZipcode('75224');
                if (batches && batches.length > 0) {
                    addTest(
                        'Test 1: getBatchesByZipcode',
                        'success',
                        `Found ${batches.length} batches for zipcode 75224`,
                        batches
                    );
                } else {
                    addTest(
                        'Test 1: getBatchesByZipcode',
                        'error',
                        'No batches returned'
                    );
                }
            } catch (error) {
                addTest(
                    'Test 1: getBatchesByZipcode',
                    'error',
                    `Error: ${error.message}`
                );
            }

            // Test 2: Get compact batches
            try {
                const batches = await ZipcodeBatchesProvider.getCompactBatchesByZipcode('75224');
                if (batches && batches.length > 0) {
                    addTest(
                        'Test 2: getCompactBatchesByZipcode',
                        'success',
                        `Found ${batches.length} batch codes for zipcode 75224`,
                        batches
                    );
                } else {
                    addTest(
                        'Test 2: getCompactBatchesByZipcode',
                        'error',
                        'No batches returned'
                    );
                }
            } catch (error) {
                addTest(
                    'Test 2: getCompactBatchesByZipcode',
                    'error',
                    `Error: ${error.message}`
                );
            }

            // Test 3: Get metadata
            try {
                const metadata = await ZipcodeBatchesProvider.getMetadata();
                if (metadata && metadata.totalZipcodes && metadata.totalBatches) {
                    addTest(
                        'Test 3: getMetadata',
                        'success',
                        'Retrieved metadata successfully',
                        metadata
                    );
                } else {
                    addTest(
                        'Test 3: getMetadata',
                        'error',
                        'Invalid metadata structure'
                    );
                }
            } catch (error) {
                addTest(
                    'Test 3: getMetadata',
                    'error',
                    `Error: ${error.message}`
                );
            }

            // Test 4: Get all zipcodes
            try {
                const zipcodes = await ZipcodeBatchesProvider.getAllZipcodes();
                if (zipcodes && zipcodes.length > 0) {
                    addTest(
                        'Test 4: getAllZipcodes',
                        'success',
                        `Found ${zipcodes.length} zipcodes`,
                        zipcodes.slice(0, 10) // Show first 10
                    );
                } else {
                    addTest(
                        'Test 4: getAllZipcodes',
                        'error',
                        'No zipcodes returned'
                    );
                }
            } catch (error) {
                addTest(
                    'Test 4: getAllZipcodes',
                    'error',
                    `Error: ${error.message}`
                );
            }

            // Test 5: Get zipcodes by batch
            try {
                const zipcodes = await ZipcodeBatchesProvider.getZipcodesByBatch('FK5127');
                if (zipcodes && zipcodes.length > 0) {
                    addTest(
                        'Test 5: getZipcodesByBatch',
                        'success',
                        `Batch FK5127 found in ${zipcodes.length} zipcodes`,
                        zipcodes
                    );
                } else {
                    addTest(
                        'Test 5: getZipcodesByBatch',
                        'error',
                        'No zipcodes returned'
                    );
                }
            } catch (error) {
                addTest(
                    'Test 5: getZipcodesByBatch',
                    'error',
                    `Error: ${error.message}`
                );
            }

            // Test 6: Non-existent zipcode
            try {
                const batches = await ZipcodeBatchesProvider.getBatchesByZipcode('99999');
                if (batches && batches.length === 0) {
                    addTest(
                        'Test 6: Non-existent zipcode',
                        'success',
                        'Correctly returns empty array for non-existent zipcode',
                        batches
                    );
                } else {
                    addTest(
                        'Test 6: Non-existent zipcode',
                        'error',
                        'Should return empty array'
                    );
                }
            } catch (error) {
                addTest(
                    'Test 6: Non-existent zipcode',
                    'error',
                    `Error: ${error.message}`
                );
            }

            // Test 7: Caching
            try {
                const start = performance.now();
                await ZipcodeBatchesProvider.getBatchesByZipcode('75224');
                const firstCall = performance.now() - start;

                const start2 = performance.now();
                await ZipcodeBatchesProvider.getBatchesByZipcode('75224');
                const secondCall = performance.now() - start2;

                if (secondCall < firstCall * 0.5) {
                    addTest(
                        'Test 7: Caching',
                        'success',
                        `Cache working: First call ${firstCall.toFixed(2)}ms, Second call ${secondCall.toFixed(2)}ms`,
                        { firstCall: `${firstCall.toFixed(2)}ms`, secondCall: `${secondCall.toFixed(2)}ms` }
                    );
                } else {
                    addTest(
                        'Test 7: Caching',
                        'success',
                        `Cache test complete (timing may vary)`,
                        { firstCall: `${firstCall.toFixed(2)}ms`, secondCall: `${secondCall.toFixed(2)}ms` }
                    );
                }
            } catch (error) {
                addTest(
                    'Test 7: Caching',
                    'error',
                    `Error: ${error.message}`
                );
            }

            console.log('All tests completed');
        }

        // Run tests when page loads
        window.addEventListener('load', runTests);
    </script>
</body>
</html>
